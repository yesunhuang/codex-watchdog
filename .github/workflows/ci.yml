name: Cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: codex-watchdog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.9 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and tests
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e . pytest
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tools tests

      - name: Run test suite
        run: python -m pytest

      - name: Smoke test CLI and version
        run: |
          python -m codex_watchdog --version
          python -m codex_watchdog --help
