name: Release Windows beta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

concurrency:
  group: codex-watchdog-version-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out complete public history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up release Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Detect an unreleased SemVer change
        id: version
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          function Read-ProjectVersion([string]$Text) {
            $project = [regex]::Match($Text, '(?ms)^\[project\]\s*(.*?)(?=^\[|\z)')
            if (-not $project.Success) { throw 'Missing [project] table.' }
            $match = [regex]::Match($project.Groups[1].Value, '(?m)^version\s*=\s*"([^"]+)"\s*$')
            if (-not $match.Success) { throw 'Missing [project] version.' }
            return $match.Groups[1].Value
          }

          $current = Read-ProjectVersion (Get-Content -Raw -LiteralPath pyproject.toml)
          if ($current -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Project version is not valid SemVer: $current"
          }
          $previous = $null
          if ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            $previousText = git show "${env:BEFORE_SHA}:pyproject.toml" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $previous = Read-ProjectVersion ($previousText -join "`n")
            }
          }
          if ($previous -eq $current) {
            "should_release=false" >> $env:GITHUB_OUTPUT
            "version=$current" >> $env:GITHUB_OUTPUT
            Write-Host "pyproject.toml changed without a version change; no release."
            exit 0
          }

          $tag = "v$current"
          git show-ref --tags --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            throw "Tag already exists: $tag"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists: $tag"
          }
          "should_release=true" >> $env:GITHUB_OUTPUT
          "version=$current" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version changed from '$previous' to '$current'; release is eligible."
          exit 0

      - name: Install pinned release environment
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.0.1
          python -m pip install --disable-pip-version-check -r requirements-release.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          python -m pip check

      - name: Run source and version gates
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          python -m pytest --basetemp .pytest-temp-release
          python -m compileall -q src tools tests
          $reported = (python -m codex_watchdog --version | Out-String).Trim()
          $expected = "codex-watchdog ${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0 -or $reported -ne $expected) {
            throw "Source CLI version mismatch: '$reported' != '$expected'"
          }

      - name: Scan complete public history with Gitleaks
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_windows_x64.zip' --dir $toolRoot
          $archive = Join-Path $toolRoot 'gitleaks_8.30.1_windows_x64.zip'
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Gitleaks checksum mismatch: $actual" }
          $expanded = Join-Path $toolRoot 'expanded'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          & (Join-Path $expanded 'gitleaks.exe') git --no-banner --no-color --redact=100 --ignore-gitleaks-allow --report-format json --report-path (Join-Path $toolRoot 'report.json') --log-opts='--all --full-history' .
          if ($LASTEXITCODE -ne 0) { throw "Gitleaks returned exit code $LASTEXITCODE" }

      - name: Build Windows x64 package
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          .\scripts\build_windows_release.ps1 -Python (Get-Command python).Source -OutputDirectory dist

      - name: Verify embedded application icon
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          python .\tools\verify_windows_executable_icon.py `
            --executable ".\dist\codex-watchdog-v${{ steps.version.outputs.version }}-windows-x64\codex-watchdog.exe" `
            --icon ".\images\codex-watchdog.ico"

      - name: Test package without Python on PATH
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          .\scripts\test_windows_package.ps1 `
            -PackageDirectory ".\dist\codex-watchdog-v${{ steps.version.outputs.version }}-windows-x64" `
            -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Create immutable beta release
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $zip = ".\dist\codex-watchdog-v$version-windows-x64.zip"
          gh release create $tag `
            $zip `
            '.\dist\SHA256SUMS.txt' `
            '.\LICENSE' `
            '.\THIRD_PARTY_NOTICES.md' `
            '.\ASSETS.md' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Codex WatchDog $tag beta" `
            --prerelease `
            --generate-notes
