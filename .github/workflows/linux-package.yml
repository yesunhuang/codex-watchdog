name: Linux executable packages

'on':
  push:
    branches:
      - codex-a/linux-packages
      - codex-a/rebind-and-ca
      - codex-a/linux-rhel8
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Linux ${{ matrix.architecture }} executable acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-linux-package.txt
      - name: Install pinned native build dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.0.1
          python -m pip install --disable-pip-version-check -r requirements-linux-package.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          python -m pip check
      - name: Verify the source and shared installer regressions
        run: |
          python -m compileall -q src tools tests packaging scripts
          python -m pytest --basetemp .pytest-temp-linux-package
      - name: Build the native ELF package and dependency inventory
        if: matrix.architecture == 'arm64'
        run: python scripts/build_linux_package.py
      - name: Build x64 against the RHEL 8 glibc baseline
        if: matrix.architecture == 'x64'
        run: |
          docker build --file packaging/linux-rhel8.Dockerfile --tag watchdog-rhel8-builder .
          docker run --rm --volume "$PWD:/workspace" --env BUILDER_UID="$(id -u)" --env BUILDER_GID="$(id -g)" watchdog-rhel8-builder bash -euc '
            python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
            python -m compileall -q src tools tests packaging scripts
            python -m pytest --basetemp .pytest-temp-rhel8-package
            python scripts/build_linux_package.py
            chown -R "$BUILDER_UID:$BUILDER_GID" dist build .pytest-temp-rhel8-package
          '
      - name: Test the package with Python hidden
        run: python scripts/test_linux_package.py --package dist/*-linux-${{ matrix.architecture }}
      - name: Repeat x64 package acceptance on glibc 2.28
        if: matrix.architecture == 'x64'
        run: |
          cp dist/linux-x64-package-acceptance.json dist/linux-x64-ubuntu-package-acceptance.json
          docker run --rm --volume "$PWD:/workspace" watchdog-rhel8-builder bash -euc '
            # UBI omits this host prerequisite. Give only this disposable fixture
            # container an identity; preserve the product locality fence.
            test -s /etc/machine-id || tr -d "-" < /proc/sys/kernel/random/uuid > /etc/machine-id
            python scripts/test_linux_package.py --package dist/*-linux-x64
          '
      - uses: actions/upload-artifact@v4
        # Retain a failed development candidate for isolated diagnosis. Release
        # callers still require successful acceptance before uploading assets.
        if: success() || (failure() && github.ref == 'refs/heads/codex-a/linux-rhel8')
        with:
          name: linux-${{ matrix.architecture }}-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
            dist/linux-${{ matrix.architecture }}*-package-acceptance.json
          if-no-files-found: error
          retention-days: 14
