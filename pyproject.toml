[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-watchdog"
version = "1.0.3"
description = "Deterministic Codex hooks, same-thread wake, and Git sensor"
requires-python = ">=3.9"
dependencies = [
    "msal>=1.38,<2",
    "msal-extensions>=1.3,<2",
    "slack-bolt>=1.20,<2",
    "lark-channel-sdk==1.4.0",
]

[project.scripts]
codex-watchdog = "codex_watchdog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
